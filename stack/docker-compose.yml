# asr-web — static site (speech recognition in the browser).
# Serves the built `dist/` with nginx; there is no server-side logic. Model weights are
# fetched by the browser from the sources listed in config.json, not from this container.
#
# External access: put a TLS reverse proxy in front of ${ASR_WEB_PORT}.
# Data: ${ASR_WEB_DIST} — the build output (dist/), read-only.
# Resources: no cpus: limit (see the lab's Synology cgroup notes), memory cap only.

x-svc: &svc
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: asr-web
    <<: *svc
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - ${ASR_WEB_DIST:?path to the built dist/}:/usr/share/nginx/html:ro
    networks:
      - default
    ports:
      - "${ASR_WEB_PORT:?host port}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/config.json"]
      interval: 60s
      timeout: 5s
      retries: 3
    mem_limit: 128m

configs:
  nginx_conf:
    content: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          # Compressed transfer for the app bundle and the WebAssembly modules.
          gzip on;
          gzip_types application/javascript text/javascript application/wasm application/json text/css image/svg+xml;
          gzip_min_length 1024;

          # The stock mime.types (included at http level) already knows wasm/js/json;
          # a "types {}" block here would REPLACE that table, so only fill the gaps.
          location ~* \.mjs$ { default_type application/javascript; add_header Cache-Control "public, max-age=604800"; }
          location ~* \.webmanifest$ { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

          # Hashed bundles never change; the sherpa/ORT binaries change only with a release.
          location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
          location /wasm/   { add_header Cache-Control "public, max-age=604800"; }
          location /ort/    { add_header Cache-Control "public, max-age=604800"; }
          location /models/ { add_header Cache-Control "public, max-age=604800"; }

          # The shell, the installation config and the manifest are always revalidated.
          location = /index.html   { add_header Cache-Control "no-cache"; }
          location = /config.json  { add_header Cache-Control "no-cache"; }
          location = /sw.js        { add_header Cache-Control "no-cache"; }

          # SPA fallback without nginx variables: compose (and Portainer) interpolate "$uri"
          # away, which turned "try_files $uri /index.html" into a 301 loop on "/".
          location / {
              error_page 404 =200 /index.html;
          }
      }

networks:
  default:
    name: asr-web_default
    ipam:
      config:
        - subnet: ${ASR_WEB_SUBNET:?docker subnet, e.g. 172.16.4.176/28}
